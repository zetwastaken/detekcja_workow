name: Quality

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black pylint torch torchvision opencv-python timm
    - name: Run black
      run: black --check --diff .
    - name: Run pylint
      run: pylint --rcfile=.pylintrc $(find . -name "*.py" -not -path "./.*" -not -path "./.git/*")
